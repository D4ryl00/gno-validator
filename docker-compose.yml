name: gno-validator

services:
  # Optional bundled tmkms signer (softsign, dev/lab). Only started when the
  # 'tmkms-local' compose profile is active — the Makefile activates it when
  # config.overrides selects a unix:// tmkms_listener.listen_addr. For a remote
  # tmkms (tcp:// listener) no tmkms container runs; the signer lives off-host.
  tmkms:
    profiles: ['tmkms-local']
    build:
      context: .
      target: tmkms
      args:
        GNO_VERSION: ${GNO_VERSION:-master}
        GNO_REPO: ${GNO_REPO:-gnolang/gno}
        GNO_COMMIT_HASH: ${GNO_COMMIT_HASH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        DOCKERFILE_HASH: ${DOCKERFILE_HASH:-}
        ENTRYPOINT_HASH: ${ENTRYPOINT_HASH:-}
    image: gno-validator-tmkms
    # Same host user as gnoland so it can read the consensus key, write state,
    # and reach the socket gnoland creates (0600, owned by this user).
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    environment:
      TMKMS_CHAIN_ID: ${TMKMS_CHAIN_ID:-}
    volumes:
      - ./tmkms-data:/tmkms-data
      # Host bind mount (not a named volume) so gnoland — running as the non-root
      # host user — can create the listener socket here; a named volume's root is
      # root-owned and would block that.
      - ./tmkms-sock:/tmkms-sock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '1g'
        max-file: '1'

  gnoland:
    build:
      context: .
      target: gnoland
      args:
        GNO_VERSION: ${GNO_VERSION:-master}
        GNO_REPO: ${GNO_REPO:-gnolang/gno}
        GNO_COMMIT_HASH: ${GNO_COMMIT_HASH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        DOCKERFILE_HASH: ${DOCKERFILE_HASH:-}
        ENTRYPOINT_HASH: ${ENTRYPOINT_HASH:-}
    image: gno-validator-gnoland
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    labels:
      - gno-validator.validator-env.sha256=${VALIDATOR_ENV_SHA256:-}
      - gno-validator.compose-file.sha256=${COMPOSE_FILE_SHA256:-}
    environment:
      GNOLAND_EXTRA_FLAGS: ${GNOLAND_EXTRA_FLAGS:-}
      GNOLAND_NTP_UPDATE: ${GNOLAND_NTP_UPDATE:-1}
    command:
      - gnoland
      - start
      - -log-format
      - json
    volumes:
      - ./gnoland-data:/gnoland-data
      - ./genesis.json:/genesis.json:ro
      - ./config.overrides:/config.overrides:ro
      # Shared with the tmkms container in local mode: gnoland creates the
      # privval listener socket here and tmkms dials it. Host bind mount so the
      # non-root gnoland user owns the directory and can create the socket.
      - ./tmkms-sock:/tmkms-sock
    ports:
      - '${GNOLAND_RPC_LADDR:-0.0.0.0}:${GNOLAND_RPC_PORT:-26657}:26657'
      - '${GNOLAND_P2P_LADDR:-0.0.0.0}:${GNOLAND_P2P_PORT:-26656}:26656'
      # External signer privval listener (remote mode: tmkms or horcrux). Inert
      # unless config.overrides sets a tcp:// tmkms_listener.listen_addr.
      # Host binding via SIGNER_LISTEN_LADDR / SIGNER_LISTEN_PORT.
      - '${SIGNER_LISTEN_LADDR:-0.0.0.0}:${SIGNER_LISTEN_PORT:-26659}:26659'
    cap_add:
      - SYS_TIME
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: '1g'
        max-file: '${GNOLAND_LOG_SIZE:-3}'

  sentinel:
    image: ghcr.io/aeddi/gno-watchtower/sentinel:${SENTINEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sentinel.toml:/etc/sentinel/config.toml:ro
      - ./gnoland-data/config:/gnoland-config:ro
    command: run -log-format json /etc/sentinel/config.toml
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '1'
